# BBGDOS .CMD: 2-byte load address, then the program image (entry = load address)
MEMORY {
	HDR: start = $0000, size = 2, file = %O;
	RAM: start = $6100, size = $1F00, file = %O;
}
SEGMENTS {
	LOADADDR: load = HDR, type = ro;
	CODE: load = RAM, type = ro;
	RODATA: load = RAM, type = ro;
	BSS: load = RAM, type = bss;
}
