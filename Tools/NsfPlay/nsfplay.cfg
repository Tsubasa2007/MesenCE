# BBGDOS .CMD: 2-byte load address, then the program image (entry = load address).
# The RESIDENT segment is carried in the image and copied to $5000 for playback; its
# variables (RESBSS) go at $4E00.
MEMORY {
	HDR: start = $0000, size = 2, file = %O;
	RAM: start = $6100, size = $1F00, file = %O;
	RESVAR: start = $4E00, size = $0200, file = "";
	RES: start = $5000, size = $0700, file = "";
}
SEGMENTS {
	LOADADDR: load = HDR, type = ro;
	CODE: load = RAM, type = ro;
	RODATA: load = RAM, type = ro;
	RESIDENT: load = RAM, run = RES, type = rw, define = yes;
	BSS: load = RAM, type = bss, define = yes;
	RESBSS: load = RESVAR, type = bss, define = yes;
}
